name: rust-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_BUILD_JOBS: 2
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TARGET: x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=5 -o Acquire::http::Timeout=30 \
            install -y --no-install-recommends pkg-config libcap-dev libubsan1

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          targets: x86_64-unknown-linux-musl

      - name: Use hermetic Cargo home
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Cache Cargo state
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cargo-home/registry
            ${{ github.workspace }}/.cargo-home/git
            codex-rs/target
          key: da-active-steer-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: da-active-steer-${{ runner.os }}-

      - name: Install Zig
        uses: Loongphy/setup-zig@node24-lts-runtime
        with:
          version: 0.14.0

      - name: Install musl build tools
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Configure rustc UBSan wrapper
        shell: bash
        run: |
          set -euo pipefail
          ubsan="$(ldconfig -p | grep -m1 'libubsan\.so\.1' | sed -E 's/.*=> (.*)$/\1/' || true)"
          wrapper="${RUNNER_TEMP}/rustc-ubsan-wrapper"
          cat > "${wrapper}" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${ubsan}" ]]; then
            export LD_PRELOAD="${ubsan}\${LD_PRELOAD:+:\${LD_PRELOAD}}"
          fi
          exec "\$1" "\${@:2}"
          EOF
          chmod +x "${wrapper}"
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "RUSTC_WORKSPACE_WRAPPER=" >> "$GITHUB_ENV"
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY_x86_64_unknown_linux_musl=1" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_ENCODED_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "RUSTDOCFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=" >> "$GITHUB_ENV"

      - name: Configure musl rusty_v8 artifact overrides
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-musl

      - name: Run focused regression test
        shell: bash
        run: cargo test --locked --release --target "$TARGET" -p codex-tui active_steer_remains_available_when_quota_queue_is_paused

      - name: Build production binaries
        shell: bash
        run: |
          cargo build --locked --target "$TARGET" --release \
            --bin codex \
            --bin codex-code-mode-host

      - name: Strip binaries
        shell: bash
        run: |
          set -euo pipefail
          zig objcopy --strip-all "target/${TARGET}/release/codex"
          zig objcopy --strip-all "target/${TARGET}/release/codex-code-mode-host"

      - uses: actions/upload-artifact@v7
        with:
          name: da-active-steer-linux-x64
          path: |
            codex-rs/target/x86_64-unknown-linux-musl/release/codex
            codex-rs/target/x86_64-unknown-linux-musl/release/codex-code-mode-host
          if-no-files-found: error
